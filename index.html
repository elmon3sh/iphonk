<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة الحجز المسبق - iPhonk</title>
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --primary: #0071e3;
            --bg: #f5f5f7;
            --card-bg: #ffffff;
            --text: #1d1d1f;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h2 { text-align: center; color: var(--primary); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn-submit:hover { opacity: 0.9; }
        #reservationCard {
            display: none;
            border: 2px dashed var(--primary);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            background: #fafafa;
        }
        @media print {
            body * { visibility: hidden; }
            #printCardContainer, #printCardContainer * { visibility: visible; }
            #printCardContainer { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>استمارة الحجز المسبق 📱</h2>
    
    <form id="bookingForm">
        <div class="form-group">
            <label for="fullName">الاسم بالكامل:</label>
            <input type="text" id="fullName" placeholder="أدخل اسمك الثلاثي" required>
        </div>

        <div class="form-group">
            <label for="phoneNumber">رقم الهاتف:</label>
            <input type="tel" id="phoneNumber" placeholder="01xxxxxxxxx" required>
        </div>

        <div class="form-group">
            <label for="email">البريد الإلكتروني (اختياري):</label>
            <input type="email" id="email" placeholder="example@gmail.com">
        </div>

        <div class="form-group">
            <label for="selectedModel">الموديل:</label>
            <select id="selectedModel">
                <option value="iPhone 16 Pro Max">iPhone 16 Pro Max</option>
                <option value="iPhone 16 Pro">iPhone 16 Pro</option>
                <option value="iPhone 16 Plus">iPhone 16 Plus</option>
                <option value="iPhone 16">iPhone 16</option>
            </select>
        </div>

        <div class="form-group">
            <label for="selectedColor">اللون:</label>
            <input type="text" id="selectedColor" placeholder="مثال: صحراوي / أسود" required>
        </div>

        <div class="form-group">
            <label for="selectedStorage">المساحة:</label>
            <select id="selectedStorage">
                <option value="128GB">128 GB</option>
                <option value="256GB">256 GB</option>
                <option value="512GB">512 GB</option>
                <option value="1TB">1 TB</option>
            </select>
        </div>

        <div class="form-group">
            <label for="phonePriceInput">الإجمالي (جنيه):</label>
            <input type="number" id="phonePriceInput" value="60000">
        </div>

        <div class="form-group">
            <label for="depositInput">العربون المدفوع (جنيه):</label>
            <input type="number" id="depositInput" value="5000">
        </div>

        <button type="button" class="btn-submit" onclick="saveAndPrintReservation()">
            🖨️ تأكيد وحفظ الحجز (طباعة / PDF)
        </button>
    </form>

    <!-- كارت الحجز الذي سيظهر للطباعة -->
    <div id="reservationCard">
        <h3 style="text-align: center; margin: 0;">كارت حجز آيفون</h3>
        <hr>
        <p><strong>رقم التذكرة:</strong> <span id="ticketNumber"></span></p>
        <p><strong>الاسم:</strong> <span id="cardName"></span></p>
        <p><strong>الهاتف:</strong> <span id="cardPhone"></span></p>
        <p><strong>الموديل:</strong> <span id="cardModel"></span></p>
        <p><strong>المدفوع:</strong> <span id="cardDeposit"></span> جنيه</p>
        <p><strong>المتبقي:</strong> <span id="cardRemaining"></span> جنيه</p>
    </div>
</div>

<div id="printCardContainer"></div>

<script>
  // ⚠️ استبدل هذه البيانات ببيانات مشروعك من Firebase Console
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  function saveAndPrintReservation() {
      const name = document.getElementById('fullName').value.trim();
      const phone = document.getElementById('phoneNumber').value.trim();
      const email = document.getElementById('email').value.trim();

      if (!name || !phone) {
          alert('يرجى كتابة الاسم ورقم الهاتف أولاً لإصدار كارت الحجز.');
          return;
      }

      const model = document.getElementById('selectedModel').value;
      const color = document.getElementById('selectedColor').value;
      const storage = document.getElementById('selectedStorage').value;
      const price = parseFloat(document.getElementById('phonePriceInput').value) || 0;
      const deposit = parseFloat(document.getElementById('depositInput').value) || 0;
      const remaining = Math.max(0, price - deposit);
      const ticketNo = 'TK-' + Math.floor(100000 + Math.random() * 900000);

      const newReservation = {
          ticketNo: ticketNo,
          name: name,
          phone: phone,
          email: email,
          model: model,
          color: color,
          storage: storage,
          price: price,
          deposit: deposit,
          remaining: remaining,
          createdAt: new Date().toISOString(),
          dateStr: new Date().toLocaleDateString('ar-EG')
      };

      // 1. إرسال البيانات مباشرة إلى Firebase
      database.ref('orders').push(newReservation)
          .then(() => {
              // 2. تحديث الكارت وعرضه للطباعة
              document.getElementById('ticketNumber').textContent = ticketNo;
              document.getElementById('cardName').textContent = name;
              document.getElementById('cardPhone').textContent = phone;
              document.getElementById('cardModel').textContent = `${model} (${color} - ${storage})`;
              document.getElementById('cardDeposit').textContent = deposit;
              document.getElementById('cardRemaining').textContent = remaining;

              const cardNode = document.getElementById('reservationCard');
              cardNode.style.display = 'block';

              const printCardContainer = document.getElementById('printCardContainer');
              printCardContainer.innerHTML = '';
              printCardContainer.appendChild(cardNode.cloneNode(true));

              window.print();
          })
          .catch((error) => {
              alert("حدث خطأ أثناء حفظ الطلب: " + error.message);
          });
  }
</script>
</body>
</html>
